[project]
name = "aurora-assistant"
version = "0.1.0"
description = "Local KDE voice assistant controller"
requires-python = ">=3.11,<3.12"
dependencies = ["dbus-next>=0.2.3", "httpx>=0.28,<0.29", "numpy>=1.26,<3", "sounddevice>=0.5,<0.6", "soundfile>=0.13,<0.14"]

[project.optional-dependencies]
voice = ["RealtimeSTT[faster-whisper,silero-onnx-cpu,openwakeword]==1.1.2", "supertonic==1.3.1", "torch==2.8.0", "torchaudio==2.8.0", "fastapi>=0.115", "uvicorn>=0.34"]

[project.scripts]
aurora-assistant = "aurora_assistant.main:main"
aurora-tts = "aurora_assistant.tts_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/aurora_assistant"]

# The first deployment is CPU-only. GPU builds need a separately validated lock.
[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
