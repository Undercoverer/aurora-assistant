name: Migration telemetry

on:
  pull_request:
    paths:
      - 'backend/aurora_assistant/**'
      - 'tests/test_migration_telemetry.py'
      - '.github/workflows/migration-telemetry.yml'
  push:
    branches:
      - 'migration/stage-0-instrumentation'

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test instrumentation without model or desktop dependencies
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -p 'test_migration_telemetry.py' -v
