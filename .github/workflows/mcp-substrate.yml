name: MCP substrate
on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'tests/mcp/**'
      - 'nix/mcdbus.nix'
      - '.github/workflows/mcp-substrate.yml'
  push:
    branches: ['migration/stage-1-substrate']
permissions:
  contents: read
jobs:
  substrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the audited release and nixpkgs-matching library versions
        run: python -m pip install mcdbus==2026.3.6.3 fastmcp==3.4.7 dbus-fast==5.0.22
      - name: Verify protocol, denial, typing, ownership and live test service
        env:
          PYTHONPATH: mcp
          AURORA_MCP_TEST_BUS: '1'
        run: dbus-run-session -- python -m unittest discover -s tests/mcp -v
