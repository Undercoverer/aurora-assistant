name: MCP substrate
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - 'nix/module.nix'
      - 'mcp/**'
      - 'tests/mcp/**'
      - 'nix/mcdbus.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/mcp-substrate.yml'
  push:
    branches: ['migration/stage-1-substrate']
permissions:
  contents: read
jobs:
  substrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the audited release and nixpkgs-matching library versions
        run: python -m pip install mcdbus==2026.3.6.3 fastmcp==3.4.7 dbus-fast==5.0.22 dbus-next httpx numpy soundfile fastapi huggingface_hub onnxruntime==1.31.0 tokenizers onnx
      - name: Verify protocol, denial, typing, ownership and live test service
        env:
          PYTHONPATH: backend:mcp
          AURORA_MCP_TEST_BUS: '1'
        run: |
          dbus-run-session -- python -m unittest discover -s tests/mcp -v
          python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035
      - name: Build the package and check installed stdio startup and cleanup
        run: nix build .#mcdbus --print-build-logs
